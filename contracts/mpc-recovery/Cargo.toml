[package]
name = "mpc-recovery"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/houseofstake/tla-contracts"
license = "MIT OR Apache-2.0"
description = "MPC-mediated account recovery for House of Stake TLA wallets, with timelock and watcher-quorum verdict."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
hos-common = { path = "../../crates/hos-common" }
ed25519-dalek = { version = "2", default-features = false }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]
